<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | nokira</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a href="/index.html" class="link-text link-gallery">Home</a>
  <div class="content-table">
    <div class="gallery-container">
      
      <h1 class="gallery-title"><img src="assets/img/emojis/cat.gif" alt="" height="30px"> Nokira's Gallery</h1>
      <div class="gallery-controls">
        <input type="text" id="gallery-search" placeholder="Filter by tag">
      
        <select id="gallery-sort">
          <option value="date-desc">Date: Newest to oldest</option>
          <option value="date-asc">Date: Oldest to Newest</option>
          <option value="tag-asc">Tag: A to Z</option>
        </select>
      </div>

      <div class="gallery">

        <!-- <div class="gallery-item">
          <a href="${photo.src}" target="_blank">
            <img src="${photo.src}" alt="" class="gallery-picture" decoding="async" loading="lazy">
          </a>
          <div class="gallery-details">
            <div class="gallery-description">${photo.description}</div>
            <div class="gallery-tags">Tags: ${photo.tags}</div>
          </div>
        </div> -->

      </div>

    </div>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
